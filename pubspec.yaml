name: tienda_vertex
description: Plataforma e-commerce multi-nicho Tienda Vertex.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Estado ────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Navegación ────────────────────────────────────────────
  go_router: ^14.2.7
  url_strategy: ^0.3.0

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4
  firebase_analytics: ^11.3.3

  # ── UI / Utilidades ──────────────────────────────────────
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/